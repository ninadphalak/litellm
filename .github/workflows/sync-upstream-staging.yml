# Keeps ninadphalak/litellm:feature/llm-shield-guardrail (BerriAI/litellm#42645) mergeable
# against BerriAI/litellm:main, and keeps the PR from being auto-closed as stale.
#
# INSTALL TARGET: the fork's DEFAULT branch (litellm_internal_staging) -- NOT
# feature/llm-shield-guardrail. Scheduled workflows only run from the default branch, and
# this file must never appear in the PR diff.
#
# WHAT CAN CLOSE THE PR: upstream's stale.yml marks a PR stale after 90 days without
# activity (its own comment says it may go back to 60) and closes it 7 days later. Any push
# to the PR branch counts as activity. (#39621 was closed a different way: its base branch
# was deleted. The base is now `main`, so that cannot recur.)
#
# WHAT THIS DOES, every 6 hours:
#   1. Test-merges upstream main into the PR branch.
#      - Conflict: fails, so GitHub emails the owner, and lists the conflicting files.
#      - Clean: if the branch's newest commit is older than REFRESH_AFTER_DAYS, pushes the
#        merge. That keeps the branch current and resets the stale clock long before 60
#        days, while leaving a branch that is being worked on alone.
#   2. Checks the PR itself: it fails (and so emails you) if the PR was closed without
#      being merged, or has picked up the `stale` label. A merged PR ends the job quietly.

name: keep guardrail branch current

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Push a clean merge of upstream main now, whatever the branch's age"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-guardrail-branch
  cancel-in-progress: false

env:
  PR_BRANCH: feature/llm-shield-guardrail
  UPSTREAM_REPO: BerriAI/litellm
  UPSTREAM_BRANCH: main
  PR_NUMBER: "42645"
  # Well inside upstream's stale window (90 days, possibly 60), rarely enough that the
  # PR's full CI does not rerun for nothing.
  REFRESH_AFTER_DAYS: "21"

jobs:
  pr-state:
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - name: Check the PR is still open and not marked stale
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/$UPSTREAM_REPO/pulls/$PR_NUMBER")
          state=$(jq -r .state <<<"$pr")
          merged=$(jq -r .merged <<<"$pr")
          labels=$(jq -r '[.labels[].name] | join(",")' <<<"$pr")
          echo "state=$state merged=$merged labels=$labels"
          if [ "$merged" = "true" ]; then
            echo "state=merged" >> "$GITHUB_OUTPUT"
            echo "### #$PR_NUMBER is merged. Disable this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$state" != "open" ]; then
            echo "state=closed" >> "$GITHUB_OUTPUT"
            echo "::error::$UPSTREAM_REPO#$PR_NUMBER was closed without being merged."
            exit 1
          fi
          echo "state=open" >> "$GITHUB_OUTPUT"
          if [[ ",$labels," == *",stale,"* ]]; then
            echo "::error::$UPSTREAM_REPO#$PR_NUMBER is labelled stale; it closes 7 days later without activity."
            exit 1
          fi

  sync:
    needs: pr-state
    if: always() && needs.pr-state.outputs.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v5
        with:
          # Literal on purpose: the env context is not reliably available in `with:`.
          ref: feature/llm-shield-guardrail
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set commit identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Test-merge upstream main
        id: merge
        run: |
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the merge if the branch has gone quiet
        if: steps.merge.outputs.status == 'clean'
        env:
          FORCE: ${{ inputs.force_refresh }}
        run: |
          if git diff --quiet "origin/$PR_BRANCH" HEAD; then
            echo "Already up to date with upstream $UPSTREAM_BRANCH."
            exit 0
          fi
          newest=$(git log -1 --format=%ct "origin/$PR_BRANCH")
          age_days=$(( ( $(date +%s) - newest ) / 86400 ))
          echo "Newest commit on $PR_BRANCH is $age_days day(s) old."
          if [ "$FORCE" != "true" ] && [ "$age_days" -lt "$REFRESH_AFTER_DAYS" ]; then
            echo "Under $REFRESH_AFTER_DAYS days: merges cleanly, nothing pushed."
            exit 0
          fi
          git push origin "HEAD:$PR_BRANCH"
          echo "### Refreshed $PR_BRANCH with upstream $UPSTREAM_BRANCH (branch was $age_days days quiet)" >> "$GITHUB_STEP_SUMMARY"

      - name: Report a genuine conflict
        if: steps.merge.outputs.status == 'conflict'
        run: |
          echo "::error::upstream/$UPSTREAM_BRANCH now conflicts with $PR_BRANCH. Conflicting files:"
          while read -r f; do echo "::error::  $f"; done < "$RUNNER_TEMP/conflicts.txt"
          {
            echo "### Conflicting files"
            echo ""
            while read -r f; do echo "- \`$f\`"; done < "$RUNNER_TEMP/conflicts.txt"
            echo ""
            echo "Resolve in the worktree, keeping both sides at each conflict, then push:"
            echo '```'
            echo "cd C:/git_repo/litellm-shield-wt"
            echo "git fetch upstream $UPSTREAM_BRANCH && git merge upstream/$UPSTREAM_BRANCH"
            echo "git commit && git push origin $PR_BRANCH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
