# Keeps ninadphalak/litellm:feature/llm-shield-guardrail mergeable against
# BerriAI/litellm:litellm_internal_staging without needing a human at a desk.
#
# INSTALL TARGET: the fork's DEFAULT branch (litellm_internal_staging) -- NOT
# feature/llm-shield-guardrail. Scheduled workflows only run from the default
# branch, and this file must never appear in the PR diff (the PR's base is the
# parent repo's branch, so a commit on the fork's default branch is invisible to
# the PR).
#
# ONE-TIME SETUP: fork -> Actions tab -> "I understand my workflows, go ahead and
# enable them".  Forked repos have Actions disabled until you do that.
#
# HOW IT NOTIFIES: when the merge conflicts it aborts and exits 1. GitHub emails
# the repo owner when a *scheduled* workflow fails, so that is your signal -
# no issue tracker needed (forks have Issues disabled by default).
#
# MODE: detect-only. PUSH_ON_CLEAN is "false", so a clean merge is a silent no-op
# (the job still succeeds, no notification) and this workflow fails - and therefore
# emails you - ONLY when upstream genuinely conflicts. Set PUSH_ON_CLEAN to "true"
# to also auto-heal the branch with a merge commit on every run (note: pushes made
# with GITHUB_TOKEN do not trigger further workflow runs, so auto-merge commits
# would not re-run the PR's checks).
#
# COST NOTE: fetch-depth 0 pulls the full history (~minutes, ~1.5 GB for litellm).
# That is the reliable option. `filter: blob:none` is far lighter but can hit
# "upload-pack: not our ref" when a needed blob only exists upstream, so it is
# deliberately not used here.

name: keep guardrail branch current

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-guardrail-branch
  cancel-in-progress: false

env:
  PR_BRANCH: feature/llm-shield-guardrail
  UPSTREAM_BRANCH: litellm_internal_staging
  # false = detect-only: never push, and only fail (= only email) on a real conflict.
  PUSH_ON_CLEAN: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v5
        with:
          # Literal on purpose: the env context is not reliably available in a
          # step's `with:` block. Keep this in sync with PR_BRANCH below.
          ref: feature/llm-shield-guardrail
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set commit identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream staging
        run: |
          git remote add upstream https://github.com/BerriAI/litellm.git
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Test-merge upstream staging (nothing is kept in detect-only mode)
        id: merge
        run: |
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "Clean merge - no conflict to report."
          else
            # Record WHICH files conflict before aborting, so the notification
            # actually tells you what to fix.
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the refreshed branch
        # No env.* in this `if:` either - the guard is evaluated inside the shell,
        # where the job-level env vars are definitely exported.
        if: steps.merge.outputs.status == 'clean'
        run: |
          if [ "$PUSH_ON_CLEAN" != "true" ]; then
            echo "PUSH_ON_CLEAN=$PUSH_ON_CLEAN - detect-only mode, not pushing."
            exit 0
          fi
          if git diff --quiet "origin/$PR_BRANCH" HEAD; then
            echo "Already up to date; nothing to push."
          else
            git push origin "HEAD:$PR_BRANCH"
          fi

      - name: Notify on a genuine conflict
        if: steps.merge.outputs.status == 'conflict'
        run: |
          echo "::error::upstream/$UPSTREAM_BRANCH now conflicts with $PR_BRANCH. Conflicting files:"
          while read -r f; do echo "::error::  $f"; done < "$RUNNER_TEMP/conflicts.txt"

          {
            echo "### Conflicting files"
            echo ""
            while read -r f; do echo "- \`$f\`"; done < "$RUNNER_TEMP/conflicts.txt"
            echo ""
            echo "Resolve, then push:"
            echo '```'
            echo "cd C:/git_repo/litellm"
            echo "git fetch upstream $UPSTREAM_BRANCH"
            echo "git merge upstream/$UPSTREAM_BRANCH"
            echo "# keep BOTH sides at each conflict, then:"
            echo "git commit && git push origin $PR_BRANCH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
